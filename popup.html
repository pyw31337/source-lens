<!doctype html>
<meta charset="utf-8">
<title>Source Lens</title>
<link rel="stylesheet" href="popup.css">
<main>
  <header>
    <img src="icon-48.png" width="34" height="34" alt="">
    <div>
      <h1>Source Lens <small>0.8.4</small></h1>
      <p id="pageHost">현재 페이지</p>
    </div>
    <button id="refresh" title="새로고침">↻</button>
  </header>
  <button id="oneClickVideo" type="button">영상 원클릭 저장</button>
  <div class="toolbar">
    <span id="count">불러오는 중…</span>
    <label><input id="selectAll" type="checkbox"> 전체</label>
  </div>
  <section id="list"></section>
  <footer>
    <button id="copy">선택 URL 복사</button>
    <button id="download">선택 다운로드</button>
    <button id="zip">ZIP</button>
  </footer>
  <h2 class="hist-title">최근 수집</h2>
  <section id="history"></section>
  <p id="status"></p>
</main>
<script src="popup.js"></script>
