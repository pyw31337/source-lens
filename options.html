<!doctype html>
<meta charset="utf-8">
<title>Source Lens 설정</title>
<style>
  :root{--brand:#3ecf8e;--bg:#1c1c1c;--fg:#ededed;--muted:#8d8d8d;--border:#343434;--surface:#242424}
  body{font:14px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:var(--fg);background:var(--bg)}
  h1{font-size:22px;font-weight:600;letter-spacing:-.4px}
  h1 small{color:var(--muted);font-size:12px;margin-left:8px}
  p{color:var(--muted)}
  b{color:var(--fg)}
  code{background:var(--surface);border:1px solid var(--border);padding:2px 6px;border-radius:4px;color:var(--brand);font-size:12px}
  kbd{background:var(--surface);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-size:12px}
</style>
<h1>Source Lens <small>0.7.0</small></h1>
<p><b>Alt+클릭</b>으로 요소를 분석하거나, 확장 아이콘의 <b>영상 원클릭 저장</b>을 쓰세요.</p>
<p>패널에서 <kbd>1</kbd>–<kbd>4</kbd> 탭 전환, <kbd>S</kbd> 저장, <kbd>C</kbd> URL 복사, <kbd>Esc</kbd> 닫기.</p>
<p>분석 결과는 현재 탭에서만 처리됩니다. DRM 우회, 로그인 보호 해제, 서명 위조는 하지 않습니다.</p>
